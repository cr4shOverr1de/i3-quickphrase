# i3-quickphrase Hyprland bindings — classic hyprland.conf syntax.
# (Running the Lua config parser? Use dist/hyprland-binds.lua instead.)
#
# bindr = fire on key release; mirrors i3's `bindsym --release` and is
# MANDATORY on Wayland — the script cannot keyup a physically held
# modifier the way xdotool could on X11 (see SECURITY.md "Wayland
# differences").
#
# Add a phrase: drop phrases/<name>.txt, copy one line below, change the
# key and phrase name, then `hyprctl reload`.

bindr = ALT, M, exec, ~/.local/bin/i3-quickphrase comprehensive
bindr = ALT, period, exec, ~/.local/bin/i3-quickphrase clarify
